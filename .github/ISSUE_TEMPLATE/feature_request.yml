name: Feature request
description: Suggest an improvement to Sketchcast
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: Creator need
      description: What workflow or problem should this improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Describe the smallest useful version.
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Data or service impact
      description: Note any new uploads, providers, accounts, storage, or paid services.
